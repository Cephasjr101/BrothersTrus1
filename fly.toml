app = "brotherstrus1"
primary_region = "iad"

[build]
dockerfile = "Dockerfile"

[env]
PORT = "8000"

[mounts]
source = "btdata"
destination = "/app/data"

[http_service]
auto_start_machines = true
auto_stop_machines = true
force_https = true
internal_port = 8000
min_machines_running = 1

[[vm]]
cpu_kind = "shared"
cpus = 1
memory = "512mb"
