# Fly.io config for japafly.com (app: brotherstrus1)
# Deploy:  fly deploy
# Secrets (NEVER put keys in this file - use `fly secrets set`):
#   fly secrets set PAYSTACK_SECRET_KEY=sk_live_... BASE_URL=https://japafly.com
#
# Data persistence: the SQLite DB (accounts, bookings, payments) lives on the
# "btdata" volume mounted at /app/data - it survives every redeploy/restart.
# One-time setup:
#   fly volumes create btdata --region iad --size 1
app = 'brotherstrus1'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  # non-sensitive config only; secrets come from `fly secrets set`
  PORT = '8000'

[mounts]
  source = 'btdata'
  destination = '/app/data'

[http_service]
  internal_port = 8000
  force_https = true
  # 'stop' = scale to zero when idle. A volume can only attach to ONE machine,
  # so keep max 1 machine - and min_machines_running=1 avoids cold-start
  # timeouts (your logs showed PM05/PM11 wake failures at 0).
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
