# Fly.io config for japafly.com (app: brotherstrus1)
# Deploy:  fly deploy
# Secrets (NEVER put keys in this file - use `fly secrets set`):
#   fly secrets set PAYSTACK_SECRET_KEY=sk_live_... BASE_URL=https://japafly.com
app = 'brotherstrus1'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  # non-sensitive config only; secrets come from `fly secrets set`
  PORT = '8000'

[http_service]
  internal_port = 8000
  force_https = true
  # 'stop' = scale to zero when idle (free tier). Your logs showed
  # "could not wake up machine ... timeout" cold-start errors - if those
  # hurt, change min_machines_running to 1 to keep one machine warm.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
